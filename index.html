<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Ark Branding Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Adamina&family=Outfit:wght@800&family=Inter:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(150deg, #0f111a 0%, #1a1e2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Adamina', serif;
        }

        /* Atmospheric glow matching digitalarkas.no hero */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(900px 600px at 80% 20%, rgba(80,100,200,0.18), transparent 55%),
                radial-gradient(700px 500px at 15% 80%, rgba(40,60,160,0.14), transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        #canvas {
            position: relative;
            z-index: 1;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-text {
            position: absolute;
            top: 50%;
            left: 50%;
            width: max-content;
            text-align: center;
            white-space: nowrap;
            color: var(--text-color);
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: default;
            user-select: none;
            z-index: 10;
            transform: translate(-50%, -50%);
        }

        .char {
            display: inline-block;
            transition: color 0.5s ease, transform 0.5s ease, opacity 0.5s ease;
        }

        .char-special {
            font-family: 'Adamina', 'Outfit', 'Inter', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
        }

        .char.detached {
            color: #444;
            opacity: 0.3;
            transform: scale(0.9);
        }

        .logo-container {
            position: absolute;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            stroke: var(--text-color);
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bounce-d {
            animation: bounceD 0.7s ease-in-out;
        }

        .bounce-a {
            animation: bounceA 0.7s ease-in-out;
        }

        @keyframes bounceD {
            0%   { transform: scale(1)    rotate(-180deg); }
            40%  { transform: scale(1.025) rotate(-180deg); }
            100% { transform: scale(1)    rotate(-180deg); }
        }

        @keyframes bounceA {
            0%   { transform: scale(1);    }
            40%  { transform: scale(1.025); }
            100% { transform: scale(1);    }
        }
    </style>
</head>
<body>

    <div id="canvas">
        <div id="text-container" class="brand-text">
            <!-- Generated by JS -->
        </div>

        <div id="logo-d" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <!-- Semi-circle (D bowl) -->
                <path d="M 20 50 L 80 50 A 30 30 0 0 0 20 50" stroke-width="4" />
            </svg>
        </div>

        <div id="logo-a" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <path d="M 55 20 L 30 72" stroke-width="4" />
                <path d="M 55 20 L 65 58" stroke-width="4" />
            </svg>
        </div>
    </div>

    <script>
        const textContainer = document.getElementById('text-container');
        const logoD = document.getElementById('logo-d');
        const logoA = document.getElementById('logo-a');
        
        const brandName = "Digital Ark";
        
        function initText() {
            textContainer.innerHTML = '';
            brandName.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.className = 'char';
                if (i === 0 || i === 8) {
                    span.classList.add('char-special');
                }
                span.id = `char-${i}`;
                textContainer.appendChild(span);
            });
            // Note: " AS ©" is appended dynamically at the end of the animation
        }

        async function runAnimation() {
            // ── Reset ─────────────────────────────────────────────────────────
            initText();
            logoD.className      = 'logo-container';
            logoA.className      = 'logo-container';
            logoD.style.cssText  = '';
            logoA.style.cssText  = '';
            textContainer.style.left       = '';
            textContainer.style.transform  = '';
            textContainer.style.textAlign  = '';
            textContainer.style.transition = '';

            await new Promise(r => setTimeout(r, 1000));

            // ── 1. Detach D (index 0) and A (index 8) from text ───────────────
            const dChar = document.getElementById('char-0');
            const aChar = document.getElementById('char-8');

            dChar.classList.add('detached');
            aChar.classList.add('detached');

            const canvasRect = document.getElementById('canvas').getBoundingClientRect();
            const canvasScale = canvasRect.width / 600;

            // Form the boat with eased transform motion and a gradual reveal.
            // Each piece finishes moving before the shared settling animation.
            async function formBoatPiece(logo, character, delay, rotation) {
                const rect = character.getBoundingClientRect();
                const x = (rect.left - canvasRect.left + rect.width / 2) / canvasScale - 100;
                const y = (rect.top - canvasRect.top + rect.height / 2) / canvasScale - 100;
                logo.style.left = '0px';
                logo.style.top = '0px';
                logo.style.transition = 'none';
                const formation = logo.animate([
                    { transform: `translate(${x}px, ${y}px) rotate(0deg)`, opacity: 0 },
                    { opacity: 1, offset: 0.35 },
                    { transform: `translate(200px, 360px) rotate(${rotation}deg)`, opacity: 1 }
                ], {
                    duration: 1400,
                    delay,
                    easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                    fill: 'both'
                });
                await formation.finished;
                logo.style.left = '200px';
                logo.style.top = '360px';
                logo.style.transform = `rotate(${rotation}deg)`;
                logo.style.opacity = '1';
                formation.cancel();
            }

            await Promise.all([
                formBoatPiece(logoD, dChar, 0, -180),
                formBoatPiece(logoA, aChar, 450, 0)
            ]);

            // ── 4. Settle bounce ──────────────────────────────────────────────
            setTimeout(() => {
                logoD.classList.add('bounce-d');
                logoA.classList.add('bounce-a');
            }, 100);

            // ── 5. Boat slides left; text makes room as it approaches ─────────
            // Both pieces have landed; settle for 700ms, then hold for 300ms.
            setTimeout(() => {
                // Restore D and A characters in the text
                dChar.classList.remove('detached');
                aChar.classList.remove('detached');

                // Preserve the exact text position before appending © so its
                // extra width cannot recenter the name and cause a leftward jump.
                const textLeft = textContainer.offsetLeft - textContainer.offsetWidth / 2;
                textContainer.style.left = `${textLeft}px`;
                textContainer.style.transform = 'translateY(-50%)';
                textContainer.style.textAlign = 'left';

                // The paths occupy 60% of their SVG box: a 140px box makes
                // the visible boat 84px tall, slightly larger than the 72px text.
                const slideEase = 'left 1.6s cubic-bezier(0.4, 0, 0.2, 1), top 1.6s cubic-bezier(0.4, 0, 0.2, 1), width 1.6s ease, height 1.6s ease';
                [logoD, logoA].forEach(logo => {
                    logo.style.transition = slideEase;
                    logo.style.left = '-20px';
                    logo.style.top = '230px'; // center: 230 + 70 = 300px
                    logo.style.width = '140px';
                    logo.style.height = '140px';
                });
            }, 1100);

            // Begin moving the unchanged-size text as the boat nears its place.
            setTimeout(() => {
                textContainer.style.transition = 'left 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
                textContainer.style.left = '115px';
            }, 2000);

            // ── 6. Fade in "AS ©" together ──────────────────────────────────
            // Reveal the suffix during the boat slide, after the text position is fixed.
            setTimeout(() => {
                const items = [
                    { text: '\u00A0AS',         targetOpacity: '1',   extraStyle: 'transition: opacity 1.6s ease;' },
                    { text: '\u00A0\u00A9',     targetOpacity: '0.6',
                      extraStyle: 'font-size: 0.32em; vertical-align: super; letter-spacing: 0; font-family: sans-serif; transition: opacity 1.6s ease;' }
                ];

                items.forEach(({ text, targetOpacity, extraStyle }) => {
                    const span = document.createElement('span');
                    span.textContent = text;
                    span.className   = 'char char-special';
                    span.style.cssText  = extraStyle;
                    span.style.opacity  = '0';
                    textContainer.appendChild(span);
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        span.style.opacity = targetOpacity;
                    }));
                });
            }, 1100);
            // ── 7. Whole page becomes a link once animation is done ───────────
            // Activate after the text has settled and the suffix is visible.
            setTimeout(() => {
                document.body.style.cursor = 'pointer';
                document.body.addEventListener('click', () => {
                    window.open('https://digitalarkas.no', '_blank', 'noopener,noreferrer');
                });
            }, 3500);
        }

        // Start on load
        window.onload = runAnimation;
    </script>
</body>
</html>
