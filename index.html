<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Ark Branding Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Adamina&family=Outfit:wght@800&family=Inter:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #ffffff;
            --line-width: 6px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(150deg, #0f111a 0%, #1a1e2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Adamina', serif;
        }

        /* Atmospheric glow matching digitalarkas.no hero */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(900px 600px at 80% 20%, rgba(80,100,200,0.18), transparent 55%),
                radial-gradient(700px 500px at 15% 80%, rgba(40,60,160,0.14), transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        #canvas {
            position: relative;
            z-index: 1;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-text {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            text-align: center;
            white-space: nowrap;
            color: var(--text-color);
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: default;
            user-select: none;
            z-index: 10;
            transform: translateY(-50%);
            transition: opacity 0.8s ease,
                        font-size 0.9s ease,
                        left 0.9s ease,
                        top 0.9s ease,
                        transform 0.9s ease;
        }

        .char {
            display: inline-block;
            transition: color 0.5s ease, transform 0.5s ease, opacity 0.5s ease;
        }

        .char-special {
            font-family: 'Adamina', 'Outfit', 'Inter', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
        }

        .char.detached {
            color: #444;
            opacity: 0.3;
            transform: scale(0.9);
        }

        .logo-container {
            position: absolute;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            stroke: var(--text-color);
            stroke-width: var(--line-width);
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .falling-d {
            animation: fallD 1.53s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* No animation-delay here — JS setTimeout handles the 700ms offset */
        .falling-a {
            animation: fallA 1.53s forwards cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fallD {
            0%   { opacity: 0; }
            15%  { opacity: 1; }
            100% { opacity: 1; }
        }

        @keyframes fallA {
            0%   { opacity: 0; }
            15%  { opacity: 1; }
            100% { opacity: 1; }
        }

        .bounce-d {
            animation: bounceD 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bounce-a {
            animation: bounceA 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceD {
            0%   { transform: scale(1)    rotate(-180deg); }
            40%  { transform: scale(1.08) rotate(-180deg); }
            100% { transform: scale(1)    rotate(-180deg); }
        }

        @keyframes bounceA {
            0%   { transform: scale(1);    }
            40%  { transform: scale(1.08); }
            100% { transform: scale(1);    }
        }
    </style>
</head>
<body>

    <div id="canvas">
        <div id="text-container" class="brand-text">
            <!-- Generated by JS -->
        </div>

        <div id="logo-d" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <!-- Semi-circle (D bowl) -->
                <path d="M 20 50 L 80 50 A 30 30 0 0 0 20 50" stroke-width="4" />
            </svg>
        </div>

        <div id="logo-a" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <path d="M 55 20 L 30 72" stroke-width="4" />
                <path d="M 55 20 L 65 58" stroke-width="4" />
            </svg>
        </div>
    </div>

    <script>
        const textContainer = document.getElementById('text-container');
        const logoD = document.getElementById('logo-d');
        const logoA = document.getElementById('logo-a');
        
        const brandName = "Digital Ark";
        
        function initText() {
            textContainer.innerHTML = '';
            brandName.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.className = 'char';
                if (i === 0 || i === 8) {
                    span.classList.add('char-special');
                }
                span.id = `char-${i}`;
                textContainer.appendChild(span);
            });
            // Note: " AS ©" is appended dynamically at the end of the animation
        }

        async function runAnimation() {
            // ── Reset ─────────────────────────────────────────────────────────
            initText();
            logoD.className      = 'logo-container';
            logoA.className      = 'logo-container';
            logoD.style.cssText  = '';
            logoA.style.cssText  = '';
            textContainer.style.opacity    = '1';
            textContainer.style.left       = '';
            textContainer.style.right      = '';
            textContainer.style.textAlign  = '';
            textContainer.style.fontSize   = '';
            textContainer.style.transition = '';

            await new Promise(r => setTimeout(r, 1000));

            // ── 1. Detach D (index 0) and A (index 8) from text ───────────────
            const dChar = document.getElementById('char-0');
            const aChar = document.getElementById('char-8');

            dChar.classList.add('detached');
            aChar.classList.add('detached');

            const canvasRect = document.getElementById('canvas').getBoundingClientRect();

            // ── 2. D: appear at text position → fall DOWN below text ─────────
            const dRect = dChar.getBoundingClientRect();
            const startX = dRect.left - canvasRect.left + (dRect.width  / 2);
            const startY = dRect.top  - canvasRect.top  + (dRect.height / 2);

            logoD.style.left    = `${startX - 100}px`;
            logoD.style.top     = `${startY - 100}px`;
            logoD.style.opacity = '1';
            logoD.classList.add('falling-d');

            // Fall to centre-of-canvas horizontally, well below the text row
            setTimeout(() => {
                logoD.style.transition = 'left 0.8s cubic-bezier(0.47, 0, 0.745, 0.715), top 0.8s cubic-bezier(0.47, 0, 0.745, 0.715), transform 0.8s cubic-bezier(0.47, 0, 0.745, 0.715)';
                logoD.style.left      = '200px';
                logoD.style.top       = '360px';   // below text centre (300px)
                logoD.style.transform = 'rotate(-180deg)';
            }, 100);

            // ── 3. A: appear at text position → fall DOWN and snap onto D ────
            const aRect   = aChar.getBoundingClientRect();
            const startXA = aRect.left - canvasRect.left + (aRect.width  / 2);
            const startYA = aRect.top  - canvasRect.top  + (aRect.height / 2);

            logoA.style.left    = `${startXA - 100}px`;
            logoA.style.top     = `${startYA - 100}px`;
            logoA.style.opacity = '1';
            logoA.classList.add('falling-a');

            setTimeout(() => {
                logoA.style.transition = 'left 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                logoA.style.left = '200px';
                logoA.style.top  = '360px';        // same as D — overlaps to form logo
            }, 700);

            // ── 4. Settle bounce ──────────────────────────────────────────────
            setTimeout(() => {
                logoD.classList.add('bounce-d');
                logoA.classList.add('bounce-a');
            }, 1600);

            // ── 5. Logo slides left, text shifts right ────────────────────────
            // 1600ms bounce start + 600ms bounce + 600ms pause = 2800ms
            setTimeout(() => {
                // Restore D and A characters in the text
                dChar.classList.remove('detached');
                aChar.classList.remove('detached');

                // Shift text rightward to make room: 25px logo-left + 80px logo + 10px gap = 115px
                textContainer.style.transition = 'left 0.9s cubic-bezier(0.4, 0, 0.2, 1), right 0.9s cubic-bezier(0.4, 0, 0.2, 1), font-size 0.9s ease';
                textContainer.style.left      = '115px';
                textContainer.style.right     = 'auto';
                textContainer.style.textAlign = 'left';
                textContainer.style.fontSize  = '56px';

                // Slide both logo elements to the left edge, shrink to inline size, and centre the group
                // Group: 80px logo + 10px gap + ~460px text ≈ 550px → left margin ≈ 25px to centre in 600px
                const slideEase = 'left 0.9s cubic-bezier(0.4, 0, 0.2, 1), top 0.9s cubic-bezier(0.4, 0, 0.2, 1), width 0.9s ease, height 0.9s ease';
                logoD.style.transition = slideEase;
                logoA.style.transition = slideEase;
                logoD.style.left   = '25px';
                logoD.style.top    = '260px';  // centre: 260 + 40 = 300px = text centre
                logoD.style.width  = '80px';
                logoD.style.height = '80px';
                logoA.style.left   = '25px';
                logoA.style.top    = '260px';
                logoA.style.width  = '80px';
                logoA.style.height = '80px';
            }, 2800);

            // ── 6. Fade in "AS ©" letter by letter ───────────────────────────
            // 2800ms slide start + 900ms slide + 300ms pause = 4000ms
            setTimeout(() => {
                const items = [
                    { text: '\u00A0AS',         delay: 0, targetOpacity: '1',   extraStyle: 'transition: opacity 2s ease;' },
                    { text: '\u00A0\u00A9',     delay: 0, targetOpacity: '0.6',
                      extraStyle: 'font-size: 0.32em; vertical-align: super; letter-spacing: 0; font-family: sans-serif; transition: opacity 2s ease;' }
                ];

                items.forEach(({ text, delay, targetOpacity, extraStyle }) => {
                    setTimeout(() => {
                        const span = document.createElement('span');
                        span.textContent = text;
                        span.className   = 'char char-special';
                        span.style.cssText  = extraStyle;
                        span.style.opacity  = '0';
                        textContainer.appendChild(span);
                        requestAnimationFrame(() => requestAnimationFrame(() => {
                            span.style.opacity = targetOpacity;
                        }));
                    }, delay);
                });
            }, 4000);
            // ── 7. Whole page becomes a link once animation is done ───────────
            // Wait for AS + © to fully fade in (2s fade) then activate
            setTimeout(() => {
                document.body.style.cursor = 'pointer';
                document.body.addEventListener('click', () => {
                    window.open('https://digitalarkas.no', '_blank', 'noopener,noreferrer');
                });
            }, 6200);
        }

        // Start on load
        window.onload = runAnimation;
    </script>
</body>
</html>
