<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Ark — Leaderboard Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Adamina&family=Outfit:wght@800&family=Inter:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #ffffff;
            --line-width: 3px;
            --banner-w: 728px;
            --banner-h: 90px;
            --logo-size: 70px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(150deg, #0f111a 0%, #1a1e2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Adamina', serif;
        }

        #canvas {
            position: relative;
            width: var(--banner-w);
            height: var(--banner-h);
            background: linear-gradient(150deg, #0f111a 0%, #1a1e2e 100%);
            overflow: hidden;
            outline: 1px solid #222;
        }

        .brand-text {
            position: absolute;
            top: 50%;
            left: 36px;
            transform: translateY(-50%);
            white-space: nowrap;
            color: var(--text-color);
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: default;
            user-select: none;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        .char {
            display: inline-block;
            transition: color 0.5s ease, transform 0.5s ease, opacity 0.5s ease;
        }

        .char-special {
            font-family: 'Adamina', 'Outfit', 'Inter', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
        }

        .char.detached {
            color: #444;
            opacity: 0.3;
            transform: scale(0.9);
        }

        #divider {
            position: absolute;
            top: 15px;
            bottom: 15px;
            right: 120px;
            width: 1px;
            background: #333;
            opacity: 0;
            transition: opacity 0.6s ease 0.3s;
        }

        .logo-container {
            position: absolute;
            width: var(--logo-size);
            height: var(--logo-size);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            stroke: var(--text-color);
            stroke-width: var(--line-width);
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .falling-d {
            animation: fallD 1.44s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* No animation-delay — JS setTimeout handles the 700ms offset */
        .falling-a {
            animation: fallA 1.44s forwards cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fallD {
            0%   { opacity: 0; }
            15%  { opacity: 1; }
            100% { opacity: 1; }
        }

        @keyframes fallA {
            0%   { opacity: 0; }
            15%  { opacity: 1; }
            100% { opacity: 1; }
        }

        .bounce-d {
            animation: bounceD 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bounce-a {
            animation: bounceA 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceD {
            0%   { transform: scale(1)    rotate(-180deg); }
            40%  { transform: scale(1.08) rotate(-180deg); }
            100% { transform: scale(1)    rotate(-180deg); }
        }

        @keyframes bounceA {
            0%   { transform: scale(1);    }
            40%  { transform: scale(1.08); }
            100% { transform: scale(1);    }
        }

        #replay-btn {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: transparent;
            border: 1px solid #333;
            color: #666;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
            font-family: sans-serif;
            border-radius: 3px;
            transition: all 0.3s;
            z-index: 100;
        }

        #replay-btn:hover {
            border-color: #fff;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas">
        <div id="text-container" class="brand-text">
            <!-- Generated by JS -->
        </div>

        <!-- Vertical rule between text and logo mark -->
        <div id="divider"></div>

        <div id="logo-d" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <path d="M 20 50 L 80 50 A 30 30 0 0 0 20 50" stroke-width="4" />
            </svg>
        </div>

        <div id="logo-a" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <path d="M 55 20 L 30 72" stroke-width="4" />
                <path d="M 55 20 L 65 58" stroke-width="4" />
            </svg>
        </div>
    </div>

    <button id="replay-btn">↺ Replay</button>

    <script>
        const textContainer = document.getElementById('text-container');
        const logoD         = document.getElementById('logo-d');
        const logoA         = document.getElementById('logo-a');
        const divider       = document.getElementById('divider');
        const replayBtn     = document.getElementById('replay-btn');

        const brandName = "Digital Ark";
        const HALF      = 35;   // half of logo-size (70px)
        const LOGO_LEFT = 623;  // 728 - 70 - 35
        const LOGO_TOP  = 10;   // (90 - 70) / 2

        function initText() {
            textContainer.innerHTML = '';
            brandName.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.className = 'char';
                if (i === 0 || i === 8) {
                    span.classList.add('char-special');
                }
                span.id = `char-${i}`;
                textContainer.appendChild(span);
            });
        }

        async function runAnimation() {
            // ── Reset ──────────────────────────────────────
            initText();
            logoD.className      = 'logo-container';
            logoA.className      = 'logo-container';
            logoD.style.cssText  = '';
            logoA.style.cssText  = '';
            textContainer.style.opacity   = '1';
            textContainer.style.left      = '';   // clear any previous slide
            textContainer.style.transition = '';
            divider.style.opacity = '0';

            await new Promise(r => setTimeout(r, 800));

            // Show divider
            divider.style.opacity = '1';

            // ── 1. Identify D (index 0) and A (index 8) ───
            const dChar = document.getElementById('char-0');
            const aChar = document.getElementById('char-8');

            dChar.classList.add('detached');
            aChar.classList.add('detached');

            const canvasRect = document.getElementById('canvas').getBoundingClientRect();

            // ── 2. D: fade in from its text position → slide to logo area ──
            const dRect  = dChar.getBoundingClientRect();
            const startX = dRect.left - canvasRect.left + (dRect.width / 2);
            const startY = dRect.top  - canvasRect.top  + (dRect.height / 2);

            logoD.style.left    = `${startX - HALF}px`;
            logoD.style.top     = `${startY - HALF}px`;
            logoD.style.opacity = '1';
            logoD.classList.add('falling-d');

            // Slide D to the right logo position
            setTimeout(() => {
                logoD.style.transition = 'left 0.8s cubic-bezier(0.47, 0, 0.745, 0.715), top 0.8s cubic-bezier(0.47, 0, 0.745, 0.715), transform 0.8s cubic-bezier(0.47, 0, 0.745, 0.715)';
                logoD.style.left      = `${LOGO_LEFT}px`;
                logoD.style.top       = `${LOGO_TOP}px`;
                logoD.style.transform = 'rotate(-180deg)';
            }, 100);

            // ── 3. A: slide in from text position → snap onto D ──
            const aRect   = aChar.getBoundingClientRect();
            const startXA = aRect.left - canvasRect.left + (aRect.width  / 2);
            const startYA = aRect.top  - canvasRect.top  + (aRect.height / 2);

            logoA.style.left    = `${startXA - HALF}px`;
            logoA.style.top     = `${startYA - HALF}px`;
            logoA.style.opacity = '1';
            logoA.classList.add('falling-a');

            setTimeout(() => {
                logoA.style.transition = 'left 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                logoA.style.left = `${LOGO_LEFT}px`;
                logoA.style.top  = `${LOGO_TOP}px`;
            }, 700);

            // ── 4. Final settle bounce ─────────────────────
            setTimeout(() => {
                logoD.classList.add('bounce-d');
                logoA.classList.add('bounce-a');
            }, 1600);

            // ── 5. Slide logo to left side of brand name ──
            // Timing: 1600ms bounce delay + 600ms bounce duration + 600ms pause = 2800ms
            setTimeout(() => {
                // Restore D and A characters in the text
                dChar.classList.remove('detached');
                aChar.classList.remove('detached');

                // Hide the right-side divider — no longer needed
                divider.style.opacity = '0';

                // Shift the brand text right to make room (8px margin + 70px logo + 12px gap)
                textContainer.style.transition = 'left 0.9s cubic-bezier(0.4, 0, 0.2, 1)';
                textContainer.style.left = '90px';

                // Slide both logo elements to the left edge
                const slideEase = 'left 0.9s cubic-bezier(0.4, 0, 0.2, 1), top 0.9s cubic-bezier(0.4, 0, 0.2, 1)';
                logoD.style.transition = slideEase;
                logoA.style.transition = slideEase;
                logoD.style.left = '8px';
                logoD.style.top  = '10px';
                logoA.style.left = '8px';
                logoA.style.top  = '10px';
            }, 2800);

            // ── 6. Fade in "AS ©" once logo is in place ──────────────────────
            // 2800ms slide + 900ms duration + 100ms buffer = 3800ms
            setTimeout(() => {
                const items = [
                    { text: '\u00A0AS',     delay: 0, targetOpacity: '1',   extraStyle: 'transition: opacity 2s ease;' },
                    { text: '\u00A0\u00A9', delay: 0, targetOpacity: '0.6',
                      extraStyle: 'font-size: 0.32em; vertical-align: super; letter-spacing: 0; font-family: sans-serif; transition: opacity 2s ease;' }
                ];

                items.forEach(({ text, delay, targetOpacity, extraStyle }) => {
                    setTimeout(() => {
                        const span = document.createElement('span');
                        span.textContent = text;
                        span.className   = 'char char-special';
                        span.style.cssText  = extraStyle;
                        span.style.opacity  = '0';
                        textContainer.appendChild(span);
                        requestAnimationFrame(() => requestAnimationFrame(() => {
                            span.style.opacity = targetOpacity;
                        }));
                    }, delay);
                });
            }, 3800);

            // ── 7. Whole banner becomes a link once animation is done ─────────
            // 3800ms + 2000ms fade = 5800ms
            setTimeout(() => {
                document.body.style.cursor = 'pointer';
                document.body.addEventListener('click', () => {
                    window.open('https://digitalarkas.no', '_blank', 'noopener,noreferrer');
                });
            }, 5900);
        }

        replayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            runAnimation();
        });
        window.onload = runAnimation;
    </script>
</body>
</html>
